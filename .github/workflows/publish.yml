name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # OIDC instead of a stored token: the workflow proves its own identity to
    # npm, so there is no secret to leak or rotate.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm; the one bundled with the runner
      # image is not guaranteed to have it.
      - run: npm install -g npm@latest
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
